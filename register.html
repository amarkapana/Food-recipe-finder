<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="./register.css">
</head>
<body>
    <div class="register-cont">
        <h1>Register</h1>
        <form id="register-form">
            <label for="reg-username">Username</label><br/>
            <input type="text" id="reg-username" placeholder="Enter username" required/><br/>
            <label for="reg-password">Password</label><br/>
            <input type="password" id="reg-password" placeholder="Enter password." required/><br/>
            <button type="submit">Register</button>
        </form>
    </div>

    <script src="./registerScript.js"></script>
</body>
</html>
